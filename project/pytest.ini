# pytest.ini  (same folder as manage.py)
# FIX 1: the line  testpaths = customers  is REMOVED, so pytest finds tests in every app
# (alerts, subscriptions, reports, ...), not just customers.
[pytest]
DJANGO_SETTINGS_MODULE = project.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = -v --tb=short
