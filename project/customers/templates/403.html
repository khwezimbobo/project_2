{% extends 'customers/base.html' %}

{% block title %}Access denied{% endblock %}

{% block content %}
{# Django shows this page for every PermissionDenied (HTTP 403). #}
<div class="card shadow-sm auth-card text-center">
    <div class="card-body p-4">
        <h1 class="h3">Access denied</h1>
        <p class="text-muted">{{ exception|default:"You do not have permission to view this page." }}</p>
        <a href="{% url 'home' %}" class="btn btn-primary">Back to home</a>
    </div>
</div>
{% endblock %}
