server {
    # Listen on port 80 (standard HTTP)
    listen 80;
    
    # Tell Nginx to respond to requests to your local machine
    server_name localhost; 

    location = /favicon.ico {
        try_files $uri =404;
    }

    # Serve Static Files Directly (CSS, JS, Images)
    location /static/ {
        alias /usr/src/app/staticfiles/; # Must match STATIC_ROOT in base.py
        expires 30d;
    }

    # Proxy all other dynamic requests to the Django Gunicorn container
    location / {
        proxy_pass http://django:8000; # 'django' is the name of the Gunicorn service in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http; # We are using HTTP locally
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
