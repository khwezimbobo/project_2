name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project

    env:
      DJANGO_SETTINGS_MODULE: project.settings.test
      SECRET_KEY: ci-only-not-a-real-secret
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "3306"
      CELERY_BROKER_URL: memory://

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: System packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 . --max-line-length 120 --exclude migrations

      - name: Run tests
        run: pytest --ds=project.settings.test -v