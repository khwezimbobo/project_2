# One image (built from ./project/Dockerfile) is reused by django, celery_worker and celery_beat.
x-django-base: &django-base
  image: isp_backspace
  build:
    context: ./project
    dockerfile: Dockerfile
  volumes:
    - ./project:/usr/src/app/
  env_file:
    - .env
services:
  db:
    container_name: mysql
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"   # management UI (the broker's own port 5672 stays internal)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  django:
    <<: *django-base
    container_name: django
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  celery_worker:
    <<: *django-base
    container_name: celery_worker
    command: celery -A project worker -l info
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  celery_beat:
    <<: *django-base
    container_name: celery_beat
    # schedule file goes to /tmp so it doesn't appear in your project folder
    command: celery -A project beat -l info -s /tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql_data:
  rabbitmq_data: