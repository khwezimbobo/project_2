
# Shared configuration for Django and Celery services
x-django-base: &django-base
  image: isp_backspace
  build:
    context: ./project
    dockerfile: Dockerfile
  volumes:
    - ./project:/usr/src/app/
  env_file:
    - .env

services:

  # MySQL database
  db:
    container_name: mysql
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ message broker
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Django application served by Gunicorn
  web:
    <<: *django-base
    container_name: web
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      RUN_SETUP: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/docs/')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Celery background task worker
  celery_worker:
    <<: *django-base
    container_name: celery_worker
    command: celery -A project worker -l INFO
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_healthy

  # Celery scheduled task service
  celery_beat:
    <<: *django-base
    container_name: celery_beat
    command: celery -A project beat -l INFO -s /tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  mysql_data:
  rabbitmq_data:
