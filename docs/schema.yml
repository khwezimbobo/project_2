      - total_monthly_revenue
    Subscription:
      type: object
      description: |-
        Create and view subscriptions.

        The client sends ONLY: customer, package, contract_term, add_ons, installation_date.
        Everything else (prices, contract dates, status, created_by) is read-only, so if the
        client sends those fields DRF simply ignores them (BRD 18: client pricing is ignored).
      properties:
        subscription_id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
        package:
          type: integer
        contract_term:
          type: integer
        add_ons:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        add_on_details:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionAddOn'
          readOnly: true
        installation_date:
          type: string
          format: date
        contract_start_date:
          type: string
          format: date
          readOnly: true
        contract_end_date:
          type: string
          format: date
          readOnly: true
        base_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        add_on_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        discount_name:
          type: string
          readOnly: true
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        monthly_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        installation_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        first_month_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SubscriptionStatusEnum'
          readOnly: true
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - add_on_details
      - add_on_total
      - base_amount
      - contract_end_date
      - contract_start_date
      - contract_term
      - created_at
      - created_by
      - customer
      - discount_amount
      - discount_name
      - first_month_total
      - installation_date
      - installation_fee
      - monthly_total
      - package
      - status
      - subscription_id
      - subtotal
      - updated_at
    SubscriptionAddOn:
      type: object
      description: One add-on on a subscription, with the price it had at sign-up.
      properties:
        add_on_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        monthly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - add_on_id
      - monthly_rate
      - name
    SubscriptionStatusEnum:
      enum:
      - Pending
      - Active
      - Suspended
      - Cancelled
      type: string
      description: |-
        * `Pending` - Pending
        * `Active` - Active
        * `Suspended` - Suspended
        * `Cancelled` - Cancelled
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
